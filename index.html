<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07080c">
<title>iPhone ke Android</title>
<style>
:root{color-scheme:dark;--bg:#06202B;--card:rgba(122,226,207,.04);--line:rgba(122,226,207,.18);--ink:#FDEB9E;--mute:#7AE2CF;--a1:#077A7D;--a2:#7AE2CF;--bad:#FDEB9E;--ok:#7AE2CF}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:28px 16px 56px;
background:radial-gradient(600px 320px at 15% -5%,rgba(7,122,125,.30),transparent 70%),radial-gradient(520px 300px at 95% 5%,rgba(122,226,207,.14),transparent 70%),var(--bg)}
main{max-width:480px;margin:0 auto}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 10px}
h1 b{background:linear-gradient(90deg,var(--a2),#FDEB9E);-webkit-background-clip:text;background-clip:text;color:transparent}
.joke{margin:0 0 20px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid #FDEB9E;border-radius:12px;background:var(--card);color:var(--mute);font-style:italic;min-height:3.6em;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;backdrop-filter:blur(8px)}
.drop{display:block;border:1.5px dashed rgba(122,226,207,.35);border-radius:14px;padding:26px 12px;text-align:center;cursor:pointer;color:var(--mute);word-break:break-all;transition:.2s}
.drop:hover,.drop.over{border-color:#FDEB9E;color:var(--ink);background:rgba(122,226,207,.05)}
.drop input{display:none}
.field{margin-top:18px}
.field>span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.seg{display:flex;gap:6px}
.seg label{flex:1}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:11px;cursor:pointer;color:var(--mute);transition:.15s}
.seg input:checked+span{color:#FDEB9E;border-color:transparent;background:linear-gradient(135deg,var(--a1),#06202B);box-shadow:0 0 18px rgba(7,122,125,.4)}
select{width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:#06202B;color:var(--ink);font:inherit}
button#go{width:100%;margin-top:22px;padding:14px;border:0;border-radius:13px;color:#06202B;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#7AE2CF,#FDEB9E);box-shadow:0 6px 28px rgba(122,226,207,.25)}
button#go:disabled{opacity:.45;cursor:default;box-shadow:none}
#status{margin-top:14px;font-size:14px;color:var(--mute);min-height:1.4em}
#status.err{color:var(--bad)}
.bar{height:6px;background:rgba(122,226,207,.10);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#077A7D,#7AE2CF,#FDEB9E);box-shadow:0 0 12px var(--a2);transition:width .3s}
#dl{display:block;text-align:center;padding:13px;border-radius:13px;background:rgba(122,226,207,.12);border:1px solid rgba(122,226,207,.5);color:var(--ok);text-decoration:none;font-weight:600}
pre{white-space:pre-wrap;font-size:12px;color:var(--mute);margin:12px 0 0}
footer{text-align:center;font-size:12px;color:rgba(122,226,207,.65);margin-top:24px}
.steps{display:flex;gap:6px;margin:16px 0 0;padding:0}
.steps li{flex:1;list-style:none;text-align:center;font-size:11px;padding:6px 0;border-radius:8px;border:1px solid var(--line);color:rgba(122,226,207,.65)}
.steps li.on{color:#FDEB9E;border-color:#FDEB9E;box-shadow:0 0 10px rgba(253,235,158,.3)}
.steps li.done{color:var(--ok);border-color:rgba(122,226,207,.5)}
.pct{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-top:8px;color:var(--mute)}
.pct b{color:var(--ink);font-size:16px}
</style>
</head>
<body>
<main>
  <h1>🎬 iPhone <b>→</b> Android</h1>
  <p class="joke" id="joke" title="Ketuk untuk guyonan lain"></p>

  <section class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="video/*,.mov">
      <span id="fname">Pilih atau seret video (.mov / .mp4)</span>
    </label>

    <div class="field">
      <span>Resolusi</span>
      <div class="seg">
        <label><input type="radio" name="preset" value="1080p" checked><span>1080p</span></label>
        <label><input type="radio" name="preset" value="720p"><span>720p</span></label>
        <label><input type="radio" name="preset" value="Tetap 4K (H.264)"><span>4K</span></label>
      </div>
    </div>

    <div class="field">
      <span>Kecepatan encode</span>
      <select id="speed">
        <option value="fast" selected>fast (seimbang)</option>
        <option value="veryfast">veryfast (cepat, file lebih besar)</option>
        <option value="medium">medium (lambat, file lebih kecil)</option>
      </select>
    </div>

    <button id="go" disabled>Menghubungkan ke server...</button>
    <ul class="steps" id="steps" hidden><li>1 Unggah</li><li>2 Antre</li><li>3 Konversi</li><li>4 Selesai</li></ul>
    <div class="bar"><i id="fill"></i></div>
    <div class="pct"><b id="pct"></b><span id="meta"></span></div>
    <div id="status"></div>
  </section>

  <section class="card" id="result" hidden>
    <a id="dl" href="#" target="_blank" rel="noopener">Unduh hasil MP4</a>
    <pre id="log"></pre>
  </section>

  <footer>Portrait atau landscape, orientasinya dijaga. Hasil dihapus server sekitar 1 jam.</footer>
</main>

<script type="module">
import { Client, handle_file } from 'https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js';

// ====== PENGATURAN ======
const SPACE = 'https://calluu-mov2mp4.hf.space';
const HF_TOKEN = '';   // kosongkan jika Space PUBLIC (token di sini terlihat oleh siapa pun)
// ========================

const JOKES = [
  'Nabung buat beli iPhone supaya nggak ribet.',
  'Video 4K di HP kentangp: ambisi besar, decoder kecil.',
  'Beli iPhone deck',
  'Lag itu bukan salah videomu. HP-mu cuma minta dimengerti.',
  'Kirim lewat WhatsApp saja biar kualitasnya sekalian dikorbankan.',
  'Kalau semua orang pakai iPhone, halaman ini menganggur. Sayang sekali, semoga tidak terjadi.',
];

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let jokeIdx = Math.floor(Math.random() * JOKES.length);
const nextJoke = () => { jokeIdx = (jokeIdx + 1) % JOKES.length; $('joke').textContent = JOKES[jokeIdx]; };
$('joke').textContent = JOKES[jokeIdx];
$('joke').onclick = nextJoke;

const setStatus = (t, err) => { $('status').textContent = t; $('status').className = err ? 'err' : ''; };
const setBar = (p) => { $('fill').style.width = Math.max(0, Math.min(100, p)) + '%'; };

function showName() {
  const f = $('file').files[0];
  $('fname').textContent = f ? f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB)' : 'Pilih atau seret video (.mov / .mp4)';
}
$('file').onchange = showName;
['dragenter', 'dragover'].forEach((ev) => $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => $('drop').addEventListener(ev, (e) => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', (e) => {
  if (e.dataTransfer.files.length) { $('file').files = e.dataTransfer.files; showName(); }
});

let client = null;
let lastErr = '';
async function connect() {
  for (let i = 0; i < 12 && !client; i++) {
    try {
      client = await Client.connect(SPACE, HF_TOKEN ? { hf_token: HF_TOKEN } : {});
    } catch (e) {
      lastErr = String((e && e.message) || e); console.error(e);
      setStatus('Server sedang bangun, tunggu sebentar... (' + (i + 1) + '/12)');
      await sleep(8000);
    }
  }
  if (client) {
    $('go').disabled = false;
    $('go').textContent = 'Konversi';
    setStatus('');
  } else {
    $('go').textContent = 'Server tidak merespons';
    setStatus('Gagal terhubung. Buka https://calluu-mov2mp4.hf.space sekali untuk membangunkan Space, lalu muat ulang halaman ini. Detail: ' + lastErr, true);
  }
}
connect();

const fmtMB = (b) => (b / 1048576).toFixed(1);
const fmtT = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const setPct = (t, m) => { $('pct').textContent = t || ''; $('meta').textContent = m || ''; };
function setStep(n) {
  $('steps').hidden = n === 0;
  [...$('steps').children].forEach((li, i) => { li.className = i + 1 < n ? 'done' : (i + 1 === n ? 'on' : ''); });
}

let lock = null;
async function keepAwake(on) {
  try {
    if (on && navigator.wakeLock) lock = await navigator.wakeLock.request('screen');
    else if (lock) { await lock.release(); lock = null; }
  } catch (e) { /* tidak didukung, abaikan */ }
}
const guard = (e) => { e.preventDefault(); e.returnValue = ''; };

// Unggah dengan persen. Mengembalikan data file untuk Gradio, atau null jika endpoint tidak cocok.
async function uploadFile(f) {
  const root = (client.config && client.config.root) || (SPACE.startsWith('http') ? SPACE : '');
  const urls = [root + '/gradio_api/upload', root + '/upload'];
  const send = (url) => new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const t0 = Date.now();
    xhr.open('POST', url);
    if (HF_TOKEN) xhr.setRequestHeader('Authorization', 'Bearer ' + HF_TOKEN);
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = e.loaded / e.total * 100;
      const speed = e.loaded / Math.max((Date.now() - t0) / 1000, 0.5);
      setBar(p);
      setPct(p.toFixed(0) + '%', fmtMB(e.loaded) + '/' + fmtMB(e.total) + ' MB | ' + fmtMB(speed) + ' MB/s | sisa ' + fmtT((e.total - e.loaded) / speed));
    };
    xhr.onload = () => {
      if (xhr.status === 404) return reject(new Error('404'));
      if (xhr.status < 200 || xhr.status >= 300) return reject(new Error('Unggah gagal (' + xhr.status + ')'));
      try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
    };
    xhr.onerror = () => reject(new Error('Koneksi terputus saat mengunggah.'));
    const fd = new FormData();
    fd.append('files', f);
    xhr.send(fd);
  });
  for (const url of urls) {
    try {
      const res = await send(url);
      return { path: res[0], orig_name: f.name, size: f.size, mime_type: f.type || 'video/quicktime', meta: { _type: 'gradio.FileData' } };
    } catch (e) {
      if (e.message !== '404') throw e;
    }
  }
  return null;
}

$('go').onclick = async () => {
  const f = $('file').files[0];
  if (!f) { setStatus('Pilih video dulu.', true); return; }
  const preset = document.querySelector('input[name=preset]:checked').value;
  const speed = $('speed').value;

  $('go').disabled = true;
  $('result').hidden = true;
  setBar(0); setPct('', ''); setStep(1);
  setStatus('Mengunggah video. Jangan tutup halaman atau kunci layar.');
  const timer = setInterval(nextJoke, 7000);
  window.addEventListener('beforeunload', guard);
  keepAwake(true);
  const t0 = Date.now();

  try {
    let fileData = null;
    try { fileData = await uploadFile(f); } catch (e) { console.error(e); }
    if (!fileData) { setStatus('Mengunggah dengan cara cadangan (tanpa persen)...'); fileData = handle_file(f); }

    setStep(2); setBar(0); setPct('', '');
    setStatus('Menunggu giliran di server...');
    const job = client.submit('/konversi', [fileData, preset, speed]);
    let result = null;
    let convStart = 0;
    for await (const msg of job) {
      if (msg.type === 'status') {
        if (msg.stage === 'error') throw new Error(msg.message || 'Konversi gagal.');
        const pd = msg.progress_data && msg.progress_data[0];
        if (pd && pd.progress != null) {
          if (!convStart) convStart = Date.now();
          setStep(3);
          const p = pd.progress * 100;
          const el = (Date.now() - convStart) / 1000;
          setBar(p);
          setPct(p.toFixed(0) + '%', 'berjalan ' + fmtT(el) + (p > 5 ? ' | sisa ' + fmtT(el * (100 - p) / p) : ''));
          setStatus('Mengonversi video...');
        } else if (msg.stage === 'pending') {
          setStep(2);
          setStatus(msg.position != null ? 'Antre, posisi ' + (msg.position + 1) + '...' : 'Menunggu giliran di server...');
        } else if (msg.stage === 'generating') {
          setStep(3);
          setStatus('Mengonversi video...');
        }
      } else if (msg.type === 'data') {
        result = msg.data;
      }
    }
    if (!result || !result[0]) throw new Error('Server tidak mengembalikan file. Cek tab Logs Space, atau coba video yang lebih pendek.');
    setStep(5); setBar(100); setPct('100%', '');
    setStatus('Selesai dalam ' + fmtT((Date.now() - t0) / 1000) + '.');
    $('dl').href = result[0].url;
    $('result').hidden = false;
  } catch (e) {
    setStatus((e && e.message) ? e.message : 'Terjadi kesalahan.', true);
  } finally {
    clearInterval(timer);
    window.removeEventListener('beforeunload', guard);
    keepAwake(false);
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
